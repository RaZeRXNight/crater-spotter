services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crater_spotter}
      POSTGRES_USER: ${POSTGRES_USER:-crater_spotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: crater-spotter-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DEVELOPMENT: "true"
      HOST: 0.0.0.0
      PORT: 8000
      DEV_DB_HOST: postgres
      DEV_DB_PORT: 5432
      DEV_DB_NAME: ${POSTGRES_DB:-crater_spotter}
      DEV_DB_USER: ${POSTGRES_USER:-crater_spotter}
      DEV_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      STORAGE_PATH: public/storage/
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/storage:/backend/public/storage
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/healthz', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    container_name: crater-spotter-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERT_DIR:-./docker/nginx/certs}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ${NGINX_CERT_DIR:-./docker/nginx/certs}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - ${NGINX_ACME_DIR:-./docker/nginx/acme}:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
