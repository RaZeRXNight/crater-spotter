services:
  backend:
    container_name: crater-spotter-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: ./backend/.env
    volumes:
      - ./.sqlite3:/.sqlite3
      - ./public/storage:/backend/public/storage
  frontend:
    container_name: crater-spotter-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./docker/nginx/certs/local.rsa.crt:/etc/nginx/certs/local.rsa.crt
      - ./docker/nginx/certs/local.rsa.key:/etc/nginx/certs/local.rsa.key
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "8443:443"
    depends_on:
      - backend
